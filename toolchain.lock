MLIR_AIE_FORK_COMMIT=035528f71cf1dd067ff01562fda99088678ca2b0   # Xilinx/mlir-aie upstream/main tip 2026-08-27, pure upstream, ZERO carries; +32 past 7e00b57955e1, which is a clean ancestor, so nothing was rebased and nothing dropped. TAKEN FOR: #3526 (the npu2 HW context pool is 16 on the Strix family, not 32 -- our hardware), #3590 (dma_await_task crash + resolution gap on a loop-carried iter_arg), #3548 (BD verification gaps). DEVICE GATE MANDATORY, no byte-identical skip: #3559 rewrites AIEDmaToNpu.cpp and BdLowering.{h,cpp} and changes the emitted transaction blob itself (its subject carries a stale "[WIP]" prefix; it merged non-draft 2026-08-20, so the tag is cosmetic). Also crossing: #3580 (aiecc lowers a device's cores once without merging their objects), #3592 (pathfinder graph port direction), #3577 (out-of-order S2MM receive channels), #3546 (shim-DMA AxCACHE attribute). MLIR core does not move here -- utils/clone-llvm.sh is byte-identical across the window -- so MLIR_DISTRO_WHEEL and NANOBIND stay. API AUDIT: all 182 route_b_kernels generators (22 aie.* modules, 46 imported symbols) import clean against the built instance, and static resolution is identical at this tip and at 7e00b57955e1. The one module that does not import is aie.iron.placers, which decode_fused/newstack_compat.py probes deliberately under noqa. This REFUTES the 'NPU1Col2 pre-existing defect' recorded at the prev pin: iron/device/__init__.py synthesizes NPU{1,2}Col{n_cols} on attribute access, so NPU1Col2 instantiates with cols=2 and no source grep can see it -- do not re-flag it. KNOWN GAP: our #3467 put cast_f32_bf16.cc and dwconv1d.cc upstream while sync_kernels.sh still overlays both from route_b_kernels, so the instance shadows the upstream copies, and the route_b cast_f32_bf16.cc lacks upstream's assert(cols % N == 0). PEANO WAS STAGED SEPARATELY and landed the next day -- see PEANO_FORK_COMMIT below; batching an LLVM major bump onto this window's gate would have made a regression unattributable. Prev pin 7e00b57955e1. Prev-prev d91f899ea9d2.
MLIR_DISTRO_WHEEL=mlir-24.0.0.2026080106+56bcc187              # Follows utils/clone-llvm.sh, which pins LLVM_PROJECT_COMMIT=56bcc1871734e6c375a254dec0ec74eb18d04a2e; provisioned at $XDNA_CACHE/mlir-distro/24.0.0.2026080106+56bcc187. NO ROLLBACK TO 23.0.0: the newest mlir-aie commit compatible with that wheel (ab85f6114de^, 2026-08-05) predates #3532, the aie-rt fix that zeroes the PT_LOAD p_memsz-p_filesz gap (merged 2026-08-11), so every 23.0.0 pairing that exists carries that corruption. Its cache dir is gone; the wheel beside it is kept, so re-provisioning is a local repack via fetch_mlir_distro.sh.
PEANO_DIST=llvm_aie-22.0.0.2026082702+91977805                 # The INSTALL SEED, not a reference: install_peano_local.sh hardlink-copies this dist for its runtimes, headers and full binutils (notably llvm-ar, which build_peano_fast.sh does not produce) and swaps only libLLVM/libclang-cpp into the copy -- so it must match PEANO_FORK_COMMIT's LLVM major. Bumped 21.0.0.2026062301+cb664e8c -> 22.0.0 with the fork advance below; its base 91977805 is 2 commits behind the aie-public tip we build. Cached unpacked at $XDNA_CACHE/peano-seed/llvm-aie-22.0.0.2026082702.
PEANO_FORK_COMMIT=a5570e2dc1443230e13bf958de6d08fa9a781775     # ACTIVE Peano = local build of atassis/llvm-aie `integration-stack` = Xilinx/llvm-aie upstream/aie-public fa749e4f5158 + FOUR carries. Two unchanged: #1148 (adjustSPReg large stack frames) and #1155 (range-check the spill immediate offset in eliminateFrameIndex). TWO ADDED 2026-09-01, both prerequisites for compiling a 64-bit-destination vector broadcast at all: (a) e91f006e, a backport of llvm-project 6a5cb5afdc83 guarding getDefSrcRegIgnoringCopies against a non-register first operand -- without it the AIE PreLegalizer Combiner crashes inside matchUndefStore; (b) 7b58c9a5 + a5570e2d, gating the G_SHUFFLE_VECTOR-side broadcast combines on the destination sizes buildBroadcastVector actually implements ({128,256,512,1024,2048}). Outside that set it builds nothing while the apply function erases the original instruction, leaving a used-but-undefined register; -O2 runs no machine verifier, so it surfaced only as a crash one pass later in the Post Legalizer Generic Combiner. matchSplatVector already gated on that set; the G_SHUFFLE_VECTOR side did not. Verified: the 4-line reproducer exits 0 (was a crash), the new combine-broadcast-unsupported-size.mir passes under -verify-machineinstrs, and 321/325 AIE GlobalISel tests pass -- the 4 non-passes are 2 xfail plus 2 (global_value_optimal_offset, movxm_global_ptradd_use) confirmed FAILING ON THE BASELINE BUILD TOO, so pre-existing. NOT YET REBUILT/INSTALLED: build-fast carries the change, the venv site-packages Peano does not. Run scripts/install_peano_local.sh and re-gate on device before trusting a build against this pin. Prev pin fd3c04a086a1.
