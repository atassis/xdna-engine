ites were SILENTLY WRONG after the auto-merge -- upstream inserted core_data BETWEEN mem_bank and aligned, so AIELowerScratchpadParameters.cpp was passing /*aligned=*/ into core_data's slot and both sites dropped alloc_group. That one is the seam class this tree keeps paying for: the labels were comments, so nothing but reading the ODS order caught it. DEVICE GATE MANDATORY: the window crosses #3751 (spill-aware resource allocation), #3711 (routing passes idempotent + lift routed designs to flows), #3740/#3747 (aie_kernels IRON migration, 31 files -- the tree sync_kernels.sh overlays, incl. rope.cc moving aie2p -> generic), and the ported allocator above changes emitted addresses for any design using alloc_group. THIS SHA IS LOCAL-ONLY: integration-stack is not pushed, so a FRESH CLONE CANNOT BUILD THIS PIN. Anchored in the build checkout ($WS/xdna-engine/mlir-aie) at refs/pins/mlir-aie-20260919 so GC cannot reap it; toolchain_up.sh resolves it by SHA out of THAT checkout, whose own `integration-stack` branch is a stale 2026-08-02 conveyor branch and must never be used by name. PLUS THREE COMMITS OFF toolchain/symtab-scan-fix, which were NEVER on integration-stack and would have been silently lost by re-pinning from it alone: 141ec0475b8 (generateUniqueSymbolName probes with SymbolTable::lookupSymbolIn, which scans every top-level op PER PROBE -- AIEAssignBuffers calls it once per unnamed buffer, so naming N buffers is O(N*ops); perf on a live 48-layer build put lookupSymbolIn at 25.72% plus BufferOp/ShimDMAAllocationOp::getInherentAttr at 20.55%/28.93%, against a build 98.3% of one core -- an overload now takes a SymbolTable the caller snapshots once, and since uniquingCounter is monotonic the NAMES ARE UNCHANGED), aef1d511162 (its sibling in AIELowerScratchpadParameters::allocateBuffers, same O(N*ops) shape) and 4f54b79c542 (npu.sync's six createConstantI32 calls were inline sibling arguments, whose C++ evaluation order is unspecified, so emitted constant order wa