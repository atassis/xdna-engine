MLIR_AIE_FORK_COMMIT=acecda2fc53e577c575043e743f7d18902805937   # Xilinx/mlir-aie upstream/main tip 2026-09-02, pure upstream, ZERO carries (mlir-aie has no entry in integration-stacks.yaml, so there was nothing to rebase and nothing to drop); +10 past 435f2cbb7465, a clean ancestor. THIS IS A ROUTINE ADVANCE TO UPSTREAM TIP, NOT A CORRECTNESS BUMP -- and the previous wording of this line said the opposite, which is the correction. It read 'TAKEN FOR #3662 ... ROOT-CAUSED ON DEVICE'; that attribution to the T=32 conv corruption was REFUTED 18 minutes after this line was written (task repin-for-aie2p-buffer-alignment-corruption, final worklog entry, committed 02:31 vs this commit's 02:13). Two artifact checks killed it: the predicted misalignment is present in a PASSING build too, and the buffer it predicts is never touched by the failing single-dispatch test (index-0 rotation lands on 0x400, 64-aligned). A matching magnitude is not a mechanism. WHAT #3662 IS STILL WORTH: without it AIEAssignBuffers has no getRequiredAlignBits() to call at all, so every core-tile buffer gets bus-width 32B alignment while getComputeTileMaxVectorAlignBits() is 512 for BaseNPU2TargetModel -- our chip class. That is a LATENT exposure for any AIE2P design placing an odd-sized buffer ahead of a >=64B one, worth carrying, not urgent. DEVICE GATED 2026-09-04, both arms built from zero in one session inside wt-repin (never the shared tree): the 17-clip encoder output is BIT-IDENTICAL across the pins on BOTH resident-MHA arms -- c5f4d1af51 at PARAKEET_RESIDENT_MHA=0 and 52adac8f22 at =1 -- and encoder_parity PASSES all five checks on both, with candidate-vs-baseline mean rel-L2 = 0.0000. Note the ARTIFACTS are NOT identical: 38 of 69 differ (27 xclbin, 11 insts .bin), sizes included, which is what #3662 predicts since it moves buffer addresses in every AIE2P design -- so this pin had to be gated on OUTPUT and could not have been skipped on hashes. The =1 arm is live coverage now, not the all-NaN row the PEANO comment below records: that was aie.core stack_size 0x400 against a 0x480 call chain, fixed in a85a9f2 (= pre-rewrite d2b03cc), and 0/17 clips carry a NaN in either arm. Also crossing: #3613 (aiecc validates stack_size against each core's call graph -- squarely on the hanging-constant history this project has paid for twice), #3619 (reject a control packet payload that overflows the wire header), #3616 (keep the runtime BD pool off statically-assigned ids). THREE OF THE TEN ARE OURS: #3641 (JIT cache keys on -I paths, retiring the last gap window_driver's _CB cache-buster was covering), #3562 (actionlint), #3604 (dependabot tracks mkdocs); the remaining two are dependabot bumps. Prev pin 435f2cbb7465. Prev-prev 035528f71cf1.
MLIR_DISTRO_WHEEL=mlir-24.0.0.2026080106+56bcc187              # Follows utils/clone-llvm.sh, which pins LLVM_PROJECT_COMMIT=56bcc1871734e6c375a254dec0ec74eb18d04a2e; provisioned at $XDNA_CACHE/mlir-distro/24.0.0.2026080106+56bcc187. NO ROLLBACK TO 23.0.0: the newest mlir-aie commit compatible with that wheel (ab85f6114de^, 2026-08-05) predates #3532, the aie-rt fix that zeroes the PT_LOAD p_memsz-p_filesz gap (merged 2026-08-11), so every 23.0.0 pairing that exists carries that corruption. Its cache dir is gone; the wheel beside it is kept, so re-provisioning is a local repack via fetch_mlir_distro.sh.
