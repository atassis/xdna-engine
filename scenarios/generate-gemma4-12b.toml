#            bash scripts/build_prefill.sh 48 64 6912 $A/prefill_m64_s6912_l48_seg4_ring
#
# GATED on device 2026-09-18, seven prompt lengths, both arms:
#   - priming: every primed_batched equals ring_tail_end(0, P-1, 64, 1024), recomputed independently
#     -- 1089->1088, 2113->2112 (two wraps past the capacity; the pre-ring path caps at 1024).
#   - tokens, teacher-forced so every step is independently comparable: top-1 53/56, top-5 56/56.
#     P=1089/1100/2113 are bit-identical to per-token prefill on every step. P=64 and P=256
#     reproduce THIS FILE's recorded numbers for the non-ring arm exactly (7/8 diverging at step 0;
#     8/8), which is the evidence the ring changed nothing where it should not have.
#   - timing, arms alternated round by round, spread <=0.5%/cell: 8.90x at P=256, 8.26x at P=1100,
