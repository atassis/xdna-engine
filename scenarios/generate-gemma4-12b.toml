[scenario]
kind = "generate"
name = "gemma4-12b"

# Gemma-4-12B, all 48 layers on the NPU. The first non-uniform model on this rail: its sliding
# layers are head_dim 256 / 8 kv heads and its global layers 512 / 1, so attention ops are built
# per GEOMETRY (gen_llm_decode.py's attn_ops factory) rather than once for the stack.
#
#   weights  scripts/dump_llm_weights.py --spec gemma4-12b --quant int8 --quant-group 64 \
#              --quant-leaves gate_proj,up_proj,down_proj,o_proj,q_proj,k_proj,v_proj
#   decode   TMV_CTX=0 GQA_GROUPED_K=1 GQA_GROUPED_V=1 FUSE_QKV_DP=0 SPLIT_LM_HEAD=0 \
#              bash scripts/build_llm_decode.sh gemma4-12b
#
# int8 g64, and BOTH halves of that are load-bearing.
#   int8, not int4: symmetric RTN int4 is 12.3% weight rel-L2 against a gate that wants ~0.3%
#     logit accuracy, and no group size or calibration closes it.
#   g64, not g128: at K=3840 the int8 width derivation returns VEC_SIZE=8, and aie::vector<int8,8>
#     is 64 bits -- below aie_api's minimum vector, so there is no vector_storage specialisation
#     and the kernel does not compile. g64 derives 16 (128-bit) and is legal.
#
# TMV_CTX=0 is REQUIRED: the global layers (head_dim 512, one kv head, batch_group 16) have no
# TMatVec tiling that fits L1. SPLIT_LM_HEAD=0 because the host loader carries one elf/kernel name,
# so a split head would be a second dispatch it cannot express.
#
# NOT the default generate model, deliberately: ~529 ms/token on the g32 arm below (~1.9 tok/s)
# and a 15.3 GB resident arena against qwen3-0.6b's 1.4 GB. Name it per request. The ~1.2 tok/s
# this line used to quote was the g64 arm.
# GROUP SIZE 32, AND THIS OVERRIDES A FAILED QUALITY GATE -- owner's call 2026-09-12, recorded
# here so it is not read later as an oversight. g32 is the FASTER arm (~529 ms/token against g64's
# ~801) and it LOST its perplexity gate: paired wikitext-2, 2000 positions, BOS, 48 layers, arms
# differing only in the packed dump -- g32 mean NLL 6.55059 / ppl 699.658 against g64's 6.50277 /
# 666.990, i.e. g32 worse by +4.898% [+1.821, +8.068], t=3.15. It was rolled back to g64 on that
# evidence and is being put back deliberately, trading measured output quality for latency.
# Two traps for whoever reads this next:
#   - top-1 is UNCHANGED (29.05% g32 vs 28.85% g64), so a short argmax parity check will not see
#     the regression; the damage is a broad distributional shift, worse at 54.2% of positions.
#   - per-site weight rel-L2 says g32 is BETTER at every site (head 0.569% vs 0.654%). It
#     disagreed with the end-to-end result in SIGN. Do not re-argue this from a weight-space norm.
# Roll back by pointing both lines at the _int8g64 pair; both artifacts are on disk.
[artifacts]
decode = "artifacts/gemma4-12b/decode_int8g32"
weights = "artifacts/gemma4-12b/weights_int8g32"
tokenizer_dir = "artifacts/gemma4-12b/tokenizer"

[generation]
max_tokens = 512
