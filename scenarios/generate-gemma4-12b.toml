#
# NOT MEASURED: per-segment dispatch against the 2 s TDR watchdog (timeout_in_sec=2, aie2_tdr.c:12).
# time_prefill.sh reports a dispatch COUNT, not a per-dispatch duration. Zero trips in ~20 device
# runs is why this ships; it is NOT a margin, so do not size a larger M against it.
#
# Rollback: point `prefill =` back at `prefill_m64_s6912_l48_seg4` and reinstall. Decode untouched.
