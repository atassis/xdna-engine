#     logits    L=6 (256 positions, served flags): fix vs control bit-for-bit IDENTICAL, both 8/8
#               vs the oracle. 48 layers (36 positions): control run twice IDENTICAL, fix vs control
#               IDENTICAL, TMV_CTX=0 vs control DIFFERENT from position 9 -- the gate can fail.
#     latency   bench floor -12.44 ms at n_past 1 (333.82 -> 321.38), -11.30 ms at 512 (335.91 ->
