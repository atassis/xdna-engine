[scenario]
kind = "generate"
name = "gemma4-12b-256k"

# Gemma-4-12B at a 262144-token context capacity. SAME weights, SAME tokenizer and the same graph
# as `gemma4-12b`; the only differences are `--max-seq 262144`, `SOFTMAX_SEGMENT=1024` and
# `ATTN_RUNTIME_EXTENT=1`.
#
# THIS IS A SEPARATE MODEL ON PURPOSE. It is not an upgrade of `gemma4-12b` and must not replace
# it -- see the price below. `gemma4-12b` stays the default at S=6912 and ~345 ms/token.
#
#   build  SOFTMAX_SEGMENT=1024 ATTN_RUNTIME_EXTENT=1 GQA_GROUPED_K=1 GQA_GROUPED_V=1 \
#            FUSE_QKV_DP=0 SPLIT_LM_HEAD=0 SLIDING_KV_CIRCULAR=1 GEN_EXTRA="--max-seq 262144" \
#            WEIGHTS=$PWD/artifacts/gemma4-12b/weights_int4g32sbf16_planar_qat_rg \
#            bash scripts/build_llm_decode.sh gemma4-12b 48 \
#              $PWD/artifacts/gemma4-12b/decode_s262144_are_tso
#
# SOFTMAX_SEGMENT=1024 IS LOAD-BEARING. Without it the global geometry's softmax holds in1+out at
# depth 2, each memref<S x bf16>, and S is capped at 8063; a second, non-decomposable wall (a
# 16384-word core-tile DMA BD against a 14-bit field) sits behind that at S~32768. Chunking clears
# both -- L1 goes 9744 B FLAT at every S -- and the output is BIT-IDENTICAL to the unchunked op
# (225/225 at 0.000e+00), because softmax_simple_bf16 already walked its row three times and
# chunking only moves the cross-pass state from a register into memory.
#
# DEVICE-GATED 2026-09-16, and the ms/token figures below are MEASUREMENTS of this artifact, not
# projections. Same prompt, temperature 0, warm, Power Mode Default, this box:
#   decode_int4g32qat_s262144_l48_rg_mc_smseg1024 (no ARE)   1661.5 ms/token   itl p50, n=16
#   decode_s262144_are_tso        (THIS DEFAULT, ARE on)     1101.0 ms/token   itl p50, n=24
#   gemma4-12b at S=6912, for scale                           345.2 ms/token   itl p50, n=24
# -560.5 ms, -33.7%, and OUTPUT-IDENTICAL: all three arms emitted the same 16 greedy token ids
# on the same prompt ([19765, 25971, 528, 3879, 659, 236787, 108, 236770, 236761, 138, 1018,
# 23969, 3411, 1018, 107, 236778]). That is what ATTN_RUNTIME_EXTENT promises by construction --
# the rows past the mask carry a softmax weight of exactly 0 -- and it is now observed rather than
# argued. The pre-ARE artifact is kept on disk as the rollback.
#
# THE PRICE, AND IT IS NOW A MEASURED LINEAR LAW, not a projection. Fitting the four arms above
# plus the prior default (S=6912 no-ARE, 358.7 ms) splits the step into an S-INDEPENDENT BASE and a
# term strictly linear in CAPACITY:
#      no-ARE   324 ms  +  5.104 us  x  S
#      ARE      325 ms  +  2.961 us  x  S
# The two bases agree to 0.4% and ARE does not touch the base, which is what it claims. The no-ARE
# slope reproduces the 5.13 us/position re-derived independently at S=6912 on 2026-09-16 -- the
# same law holds across a 38x span in S, so it can be used to price any rung: 421.8 ms at 32768,
# 712.9 at 131072, 1101.0 at 262144.
#
# WHERE THE CAPACITY TERM LIVES, from the artifact's own layout. Each global layer's kc and vc are
# `S x 512 x 2 B` flat blocks (L5_kc len 268435456 = 262144*1024, confirming head_dim 512, 1 kv
# head), so the 8 global layers hold 16384 B per POSITION and 4.29 GB at S=262144. Dividing the
# slope by that gives 5.53 GB/s under ARE and 3.21 GB/s without -- a byte rate, an order under this
# box's 52.7 GB/s read ceiling and in line with the ~6 GB/s that per-command DDR paths measure
# elsewhere in this tree. So the term is the KV STREAM, and ATTN_RUNTIME_EXTENT cannot remove it by
# construction: it cuts core work, and its own comment says so -- "a shim BD length is a static
# field on the binary TXN target, so the fill still streams the whole window and the surplus is
# drained untouched." The 40 sliding layers are circular at 1024 and contribute nothing at any S.
#
# The softmax and the elementwise scale are the OTHER two ops ARE does not reach (the chunked
# softmax walks a build-time `segs_per_row = S // segment` = 256 segments per row three times), but
# they are not where the money is: their intermediates total ~400 MB/token against the KV stream's
# 4.29 GB. Attribution between them has NOT been separated by measurement; the discriminating
# experiment is one build at SOFTMAX_SEGMENT=4096.
#
# So the lever for this model is to make the KV FILL LENGTH follow n_past, not S. `kv_block` is
# already a generator concept and is set flat (kv_block == S, "one block"); blocking it and
# dispatching only the blocks below n_past is the shape that removes the term. Until then, cost
# tracks the CAPACITY and a token at n_past=20 costs exactly what one at n_past=200000 costs.
#
# ALSO NOT ADDRESSED HERE: there is no batched prefill on this path, so a long PROMPT is still
# primed one token at a time -- at 1101 ms each. A 19-token prompt costs 21 s of ttft before the
# first token appears, which is long enough to be mistaken for a hang; two runs on 2026-09-16 were
# aborted at 14 s and read as "no result". Long conversations accumulate fine; pasting 100k tokens
# does not.
#
# TOOLCHAIN: built on MLIR_AIE_FORK_COMMIT ea0dbced832a (the 2026-09-15 repin). Each artifact is a
# self-contained ELF carrying its own toolchain hash in meta.json, so arms coexist; `npu generate
# --stats` prints which one ran.
#
# Rollback: point decode= back at decode_int4g32qat_s262144_l48_rg_mc_smseg1024 and restart.

[artifacts]
decode = "artifacts/gemma4-12b/decode_s262144_are_tso"
weights = "artifacts/gemma4-12b/weights_int4g32sbf16_planar_qat_rg"
tokenizer_dir = "artifacts/gemma4-12b/tokenizer"

[generation]
max_tokens = 512
