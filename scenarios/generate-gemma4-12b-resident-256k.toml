[scenario]
kind = "generate"
name = "gemma4-12b-resident-256k"

# rf48C: the 256k-context rung ladder with one blocked sliding ring per layer (rf-ring-write-
# overruns-into-next-layer-weights, design C), replacing rf48L, whose mirrored ring wrote past its
# region into the next layer's weights from ring row 1265. Caches live in their own BO; every
# runtime-offset BD is bounded by meta.json's s_ring_layout (K059, `resident_ladder::ring_fits`).
# Intermittent non-finite f1 dispatches remain (rf-forward-intermittent-nonfinite);
# LadderResidentForward re-runs such a dispatch.
#
# `artifacts.resident`'s meta.json (`kind = "resident_forward_ladder"`) is what routes
# registry.rs to `llm::LadderResidentForward` instead of `llm::OneCommandResidentForward`.
#
# Build: rlayer_design m g h arena seg=64,256,1024,4096 fseg=64,256,1024 split=128,256,512,1024,2048,4096
# gcap=262144 sring=1280 s64 fwd=0-47+h nbw=20 1 2 (RF_ATTN_H=1, RF_FAST=1, RF_TEXT_MARGIN=128) --
# rf48L's flags; the ring layout is the generator's (kvring.py), not a flag.
# Decode rungs (f1..f1s4096) reach 8192..262144 keys; prefill rungs (f2, f2w256, f2w1024) reach
# 4096..65536 -- past that, `LadderResidentForward::prefill` declines and the generator's
# per-token loop finishes priming through the f1 ladder alone.
[artifacts]
resident = "artifacts/gemma4-12b/resident_rf48C_p7148a7"
tokenizer_dir = "artifacts/gemma4-12b/tokenizer"

[generation]
# The context window, i.e. no cap of its own: a generation ends at end-of-turn, a full context or
# the client stopping it. A request's own max_tokens still wins.
max_tokens = 262144

# Vision/audio host towers, the same checkpoint the legacy scenario reads; rows enter through
# LadderResidentForward::set_media.
[multimodal]
tower_checkpoint = "artifacts/gemma4-12b-qat/checkpoint"
