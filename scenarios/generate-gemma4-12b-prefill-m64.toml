[scenario]
kind = "generate"
name = "gemma4-12b-prefill-m64"
# DOES NOT SERVE -- kept as the recipe and the refutation. Registering it costs a 2 s device
# timeout per request. Measured 2026-09-16, power mode Default (unpinned), toolchain 930c4ee3b2de.
#
# The arm: the SERVED decode plus a batched prefill, so prompt priming is the only difference from
# gemma4-12b. M=64 rather than the 256 prefill_s6912_l48 ships, because that one's dispatch is
# killed by the driver's 2 s TDR watchdog (aie2_tdr.c, timeout_in_sec) at 2052 ms.
#
# M=64 TIMES OUT TOO, at 2045 ms, same ctx_pc 0x28B060AD -- and M is now exhausted as a lever:
# tile_m must be a multiple of 16 (mm.cc static_assert(m % (2*r) == 0), r=8 on the bfp16-emulation
# path) and M % (tile_m * 4) == 0 (gemm/design.py hardcodes n_aie_rows=4), so 64 IS the smallest
# legal batch. The cost is not compute and does not track M: meta.json `bytes` totals 27.06 GB at
# M=64 against 35.38 GB at M=256, a 1.31x cut for a 4x cut in M, because 24.3 GB of it is
# M-independent -- about 3.8 passes over this artifact's own 6.37 GB of packed GEMM weights.
# Calibrated against qwen3-0.6b's batched prefill measured the same session (6.57 GB, 650.6 ms,
# 66 batched, needle recalled -> 10.1 GB/s effective, 5.2x under this box's 52.7 GB/s read
# ceiling), 24.3 GB is 2.41 s before a single row of work. The levers are the weight-pass count
# and splitting the command by DEPTH, not M.
#
#   prefill  IRON=$WS/wt-iron-integ SPEC=gemma4-12b NO_GOLDEN=1 WEIGHTS=/nonexistent \
#              QUANT_WEIGHTS=$A/weights_int4g32qat_hf \
#              DECODE_META=$A/decode_int4g32qat_s6912_l48_rg_mc_repin/meta.json \
#              bash scripts/build_prefill.sh 48 64 6912 $A/prefill_m64_s6912_l48
#
# QUANT_WEIGHTS must be the header_first dump, not the served row_group_planar one: the prefill
# GEMM's repack has no planar parser. WEIGHTS must NOT exist -- check_shared_weights reads the
# arena as bf16 and dies on a quantized decode. The pair checks clean, 828 shared scratch buffers.
[artifacts]
decode = "artifacts/gemma4-12b/decode_int4g32qat_s6912_l48_rg_mc_repin"
prefill = "artifacts/gemma4-12b/prefill_m64_s6912_l48"
weights = "artifacts/gemma4-12b/weights_int4g32sbf16_planar_qat_rg"
tokenizer_dir = "artifacts/gemma4-12b/tokenizer"

[generation]
max_tokens = 512
