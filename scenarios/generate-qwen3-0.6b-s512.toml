[scenario]
kind = "generate"
name = "qwen3-0.6b-s512"

# The SAME model as `qwen3-0.6b`, built with a 512-position KV window instead of 2048.
#
# S is a build parameter -- `kc`/`vc` are `[Hkv, S, HD]`, so the head stride depends on it -- and the
# decode streams the whole padded window every token regardless of how much history is in it. Cost is
# linear and measured: `ms/token = 41.43 + 3.947 us x S`, i.e. 43.4 at S=512 against 49.5 at S=2048.
#
# So this is not a different model, it is the same model at a different point on that line: -12.3%
# per token in exchange for a context that stops at 512. Pick it per REQUEST by naming it as the
# model; the engine bounds each artifact by its own `dims.S` and refuses a prompt that will not fit.
#
# Weights and tokenizer are shared with the 2048 build -- only the decode ELF differs.
[artifacts]
decode = "artifacts/qwen3-0.6b/decode_s512"
weights = "artifacts/qwen3-0.6b/weights"
tokenizer_dir = "artifacts/qwen3-0.6b/tokenizer"

[generation]
max_tokens = 1024
