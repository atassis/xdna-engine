# Video/image super-resolution. No [model] block: ESPCN is a small conv net, not a transformer --
# its whole graph (conv2d/pixel_shuffle/skip ops) lives in the schedule JSON `artifacts.weights`
# points at, not in this file.
[scenario]
kind = "image-sr"
name = "espcn"

[artifacts]
weights = "artifacts/espcn/espcn.json"
# The schedule JSON's own `checkpoint` field is a path relative to the DEV CHECKOUT (where
# `xdna-sr`/the gate tests ran from); an installed service has no checkout, so this field
# overrides it, resolved against the ENGINE ROOT instead (EngineLoader::load, image-sr arm).
# Bake it (host-only, no NPU): `install.sh` stages `artifacts/` into the engine root, so bake
# under the repo's own `artifacts/` and reinstall.
#   npu checkpoint bake --source path:artifacts/espcn/espcn_x3_dyn.onnx --arch espcn \
#     --checkpoint artifacts/espcn/espcn.safetensors
checkpoint = "artifacts/espcn/espcn.safetensors"
