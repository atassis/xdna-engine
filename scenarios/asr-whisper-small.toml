[scenario]
kind = "asr"
name = "whisper-small"

[model]
hidden = 768
ff = 3072
n_heads = 12
head_dim = 64
n_layers = 12
max_seq = 1500
precision = "bf16"
kernel = "zeropad"

[artifacts]
weights = "artifacts/whisper-small"
# Decoder built on the LLM decode rail (gen_llm_decode.py --spec whisper-small), toolchain pin
# MLIR_AIE_FORK_COMMIT 79c1952912, IRON wt-iron-integ @ b6b0945:
#   bash scripts/build_whisper_rail.sh whisper-small $PWD/artifacts/whisper-small/decode_rail_p79c1952
#   decode.elf sha256 0f58a4be9928fd691dd716a9fc9e50e12d69d946432d52a9c9a6d47745308b8a
# Gated 2026-09-29 (scripts/whisper_decode_ab.sh, 4 alternated rounds x 17 WER clips): token ids
# identical across all 16 transcriptions of every clip; pooled WER 0.1245 vs host ONNX 0.1282;
# decode 44.89 ms per emitted token vs host 68.39 and the old fused ELF 60.53.
decode = "artifacts/whisper-small/decode_rail_p79c1952"

[kernels.whole_array]
required = [
  "512x800x768_64x32x96_8c_modalid",
  "512x800x3072_64x32x96_8c_modalid",
  "512x800x3072_64x32x96_8c_modalsilu",
]
recipe = "scripts/kernel_families/whole_array.sh"
sources = ["aie_kernels", "designs/whole_array_fused", "scripts/kernel_families/whole_array.sh", "scripts/kernel_families/whole_array_recipe.py"]

[decode]
backend = "rail"
