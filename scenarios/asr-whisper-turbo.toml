[scenario]
kind = "asr"
name = "whisper-turbo"

[model]
hidden = 1280
ff = 5120
n_heads = 20
head_dim = 64
# n_layers is the ENCODER stack; the decoder is a separate, much shallower one.
n_layers = 32
n_decoder_layers = 4
n_mels = 128
max_seq = 1500
precision = "bf16"
kernel = "zeropad"

[artifacts]
weights = "artifacts/whisper-turbo"

[kernels.whole_array]
required = [
  "512x1312x1280_32x32x32_8c_modalid",
  "512x1312x5120_32x32x32_8c_modalid",
  "512x1312x5120_32x32x32_8c_modalsilu",
]
recipe = "scripts/kernel_families/whole_array.sh"
sources = ["aie_kernels", "designs/whole_array_fused", "scripts/kernel_families/whole_array.sh", "scripts/kernel_families/whole_array_recipe.py"]
