[scenario]
kind = "generate"
name = "qwen3-0.6b"

# Root-relative like every other scenario here: paths resolve against XDNA_ENGINE_ROOT under the
# service and against the repo in-tree, so one file works in both. The first version of this
# scenario named absolute paths -- first into a session scratchpad under /tmp, then into this
# developer's home -- and neither survives being installed anywhere else.
#
#   decode     scripts/build_llm_decode.sh qwen3-0.6b   (fused 28-layer ELF + meta.json, ~3.4 min)
#   weights    scripts/dump_llm_weights.py --spec qwen3-0.6b --out artifacts/qwen3-0.6b/weights
#   tokenizer  the HF snapshot dir: tokenizer.json, config.json, generation_config.json
[artifacts]
decode = "artifacts/qwen3-0.6b/decode"
weights = "artifacts/qwen3-0.6b/weights"
tokenizer_dir = "artifacts/qwen3-0.6b/tokenizer"
