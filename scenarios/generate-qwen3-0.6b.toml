[scenario]
kind = "generate"
name = "qwen3-0.6b"

# The SAME model as `qwen3-0.6b-dynwindow`, and ONE artifact, but the ELF carries FIVE named
# control codes instead of one: `main:sequence` at window 4096 plus `main:sequence_w{256,512,
# 1024,2048}`. XRT resolves a control code by kernel name against the one hw_context the ELF
# registers, so the rungs cost extra ELF and neither a context nor a rebuild.
#
# WHAT A RUNG FIXES. `qwen3-0.6b-dynwindow` takes its attention window from a scratchpad parameter
# per dispatch, but only the CORE does -- the shim's KV fill size is a static BD field, so it
# streams the whole built window every token and a drain discards the surplus. That is the entire
# measured regression against `qwen3-0.6b-buckets`. A rung is a second decode-layer design at a
# narrower window over the SAME KV capacity, so the FILL follows the window too, quantised to the
# rung rather than to the byte.
#
# The two mechanisms COMPOSE and neither replaces the other: the rung picks how many bytes the shim
# streams (coarse, one of five), the scratchpad parameter picks how many positions the core attends
# (fine, 128-position granule). Compute stays at 128 granularity at every position.
#
# Against `qwen3-0.6b-buckets` this is the same byte behaviour from ONE hardware context instead of
# four, one artifact instead of four, and no rebuild to add a window.
[artifacts]
decode = "artifacts/qwen3-0.6b/rungs4096"
# Batched prefill, S=4096 to pair with the rung ladder's own window (scripts/build_prefill.sh 28
# 256 4096; the pair is checked at load, so a mismatch refuses to bind rather than mis-binding).
# Closes the gap the ladder's own result note named: stepwise priming ran ~28-32 ms/prompt-token
# regardless of length; this measures 1.9-2.2 ms/prompt-token, ~13-17x, growing with length because
# stepwise's per-dispatch cost is flat while batched amortises over the M=256 batch. Gated 14/14 on
# scripts/gate_llm.sh --tier2-prefill (7 prompt lengths x pertok/batched arms) before landing here.
# Optional -- drop this line and the rail falls back to per-token priming with no other change.
prefill = "artifacts/qwen3-0.6b/prefill4096"
weights = "artifacts/qwen3-0.6b/weights"
tokenizer_dir = "artifacts/qwen3-0.6b/tokenizer"

[generation]
max_tokens = 1024
