[scenario]
kind = "generate"
name = "gemma3-270m"

# Gemma-3-270M fused decode. Same rail as qwen3-0.6b -- the spec is DATA
# (designs/decode_fused/llm_decode_spec.py::GEMMA3_270M), not a second generator.
#
#   decode     scripts/build_llm_decode.sh gemma3-270m   (fused 18-layer ELF + meta.json)
#   weights    scripts/dump_llm_weights.py --spec gemma3-270m (QAT checkpoint, int4 g32: ADOPTED below)
#   tokenizer  the QAT checkpoint's tokenizer files, copied to artifacts/gemma3-270m/tokenizer_qat
#
# REBUILT 2026-09-25 (`decode_p8c684`) at toolchain pin 8c684a6e9438 (the flash-attention repin):
#   same recipe, sequence_name and scratch_size identical, layout identical but for one added `xf`
#   entry (a pre-existing buffer newly named, not a graph change -- see 44d127a). L=18 oracle
#   parity 8/8 against tests/refs/gemma3-270m/bf16_oracle.json.
#
# REBUILT 2026-09-26 (`decode_p6924def`) at toolchain pin MLIR_AIE_FORK_COMMIT 6924def86b7 (the
#   elide-pm + packet-channel-sharing repin), AIECC_ELIDE_IDENTICAL_PM=1: same recipe, L=18 oracle
#   parity 8/8 against tests/refs/gemma3-270m/bf16_oracle.json. Rollback: point decode= back at
#   `decode_p8c684` and reinstall.
# REBUILT 2026-09-29 (`decode_p8e3958`) at toolchain pin 8e3958b596a, instance 3ce32a1d7465, same
#   recipe, IRON=wt-iron-integ. decode.elf BYTE-IDENTICAL to decode_p6924def (md5
#   f44bd72dd6dd5b97c43f3286bff62f3d, sequence_name/scratch_size identical) -- no re-gate needed,
#   same bytes already carry the 8/8 oracle parity above. NOTE for the next rebuilder: passing OUT
#   as a RELATIVE 3rd arg to build_llm_decode.sh silently miscompiles the artifact into a phantom
#   nested dir under the shared $WORK cache (the script cd's into $WORK before invoking the
#   generator, so a relative --out resolves against the wrong cwd) -- always pass an ABSOLUTE OUT.
# ADOPTED 2026-10-01 (`decode_qat_int4_p8e3958`): weights from
#   google/gemma-3-270m-it-qat-q4_0-unquantized, mlp/attn_o/head packed int4 g32 full_range; q/k/v
#   and norms stay bf16 (the generator cannot read them packed):
#     weights  scripts/dump_llm_weights.py --spec gemma3-270m --checkpoint-dir <qat snapshot> \
#                --out artifacts/gemma3-270m/weights_qat_int4g32 --quant int4 --quant-group 32 \
#                --quant-full-range --quant-leaves gate_proj,up_proj,down_proj,o_proj,embed_tokens
#     decode   WEIGHTS=artifacts/gemma3-270m/weights_qat_int4g32 \
#                scripts/build_llm_decode.sh gemma3-270m "" artifacts/gemma3-270m/decode_qat_int4_p8e3958
#   tokenizer_qat is the checkpoint's own tokenizer: encodings and chat template identical to the
#   unsloth one, eos_token <eos> vs <end_of_turn>, generation_config eos_token_id [1, 106] in both.
#   Unlike gemma4-12b's, this QAT checkpoint is not snapped to the Q4_0 grid (31-32 distinct values
#   per 32-block), so it is quantized as an ordinary checkpoint. Gates (Turbo): in-format oracle
#   tests/refs/gemma3-270m/qat_int4g32_oracle.json 8/8 twice, byte-identical ids. Speed flat against
#   the bf16 decode_p8e3958: 50.38/50.20 vs 50.57/50.66 ms/token, alternated; no fused arm applies to
#   this shape. The unsloth bf16 weights and decode_p8e3958 were removed once this was installed.
[artifacts]
decode = "artifacts/gemma3-270m/decode_qat_int4_p8e3958"
weights = "artifacts/gemma3-270m/weights_qat_int4g32"
tokenizer_dir = "artifacts/gemma3-270m/tokenizer_qat"
