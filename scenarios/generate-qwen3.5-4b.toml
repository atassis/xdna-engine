[scenario]
kind = "generate"
# Qwen3.5-4B: 24 Gated DeltaNet + 8 gated-attention layers. The servable arm is int4 g32 clip-search
# weights (which keep 69 of 72 JevBench decisions against bf16's 70 on the CPU reference) with a bf16
# head, and ACT_POLY=1 activations (the tanh-LUT ones put logits at 6x the bf16 floor):
#
#   decode     IRON=<wt-iron-qwen35> WEIGHTS=<the f32 dump> GEN_EXTRA="--max-seq 4096" ACT_POLY=1 \
#              DECODE_GDR_LIMBS=1 \
#              PRECISION='{"mlp": "int4/g32/clip", "attn_o": "int4/g32/clip", "qkv": "int4/g32/clip"}' \
#              scripts/build_llm_decode.sh qwen3.5-4b "" artifacts/qwen3.5-4b/decode_s4096_gdrl
#   tokenizer  the HF snapshot of Qwen/Qwen3.5-4B (tokenizer.json, tokenizer_config.json)
#
# The build reads the f32 dump (scripts/dump_llm_weights.py --spec qwen3.5-4b), 16 GB; the decode
# path never reads `weights` at runtime, only the memory-ceiling estimate does. So it names the
# arena bytes the device actually receives, 3.3 GB, not the dump. S=4096 because JevBench's hard set
# has decide prompts up to 4033 tokens; on prompts that fit S=2048 the pair's answers are
# bit-identical to the S=2048 pair's. The delta rule runs on bf16 limbs, as the prefill's does: the
# same greedy text as the exact decode and ~5% faster a token.
#
# Batched prefill, M=256 over decode's own arena, int4 rows read through DequantRows, the delta rule
# on limbs and SiLU/sigmoid from act_poly's Fast pair. 16 segments of 2 layers: one 32-layer
# dispatch at M=256 runs past the 2 s command timeout.
#   IRON=<wt-iron-qwen35> NO_GOLDEN=1 PREFILL_SEGMENTS=16 PREFILL_BFP16=0 PREFILL_ACC=1 ACT_POLY=1 \
#     PREFILL_ACT_FAST=1 SPEC=qwen3.5-4b DECODE_META=artifacts/qwen3.5-4b/decode_s4096_gdrl/meta.json \
#     scripts/build_prefill.sh 32 256 4096 artifacts/qwen3.5-4b/prefill_m256f_s4096
name = "qwen3.5-4b"

# REBUILT 2026-09-25 (`decode_s4096_gdrl_p8c684`, prefill `prefill_m256f_s4096_p8c684`) at
#   toolchain pin 8c684a6e9438 (the flash-attention repin), same recipe, now built with
#   IRON=wt-iron-integ (the iron/qwen35-deltanet branch merged into integration-stack). Decode:
#   sequence_name/scratch_size/layout/ELF size fully identical, no `xf`. Prefill: layout/scratch_size
#   /ELF size fully identical too; pairing PASS (491 shared buffers). No JevBench harness or
#   token-parity oracle is checked into this repo, so gated on device with `npu-dev
#   prefill-token-gate` (real batched-M=256 + decode path, not just verify_llm_decode.py): a 19-token
#   prompt through the batched arm, coherent and factually correct continuation
#   ("...capital of Italy is Rome. ...Spain is Madrid. ...United Kingdom is London..."),
#   byte-identical generated ids across two device runs. Weaker than a token-parity gate -- no
#   reference comparison -- flagged as such.
[artifacts]
decode = "artifacts/qwen3.5-4b/decode_s4096_gdrl_p8c684"
weights = "artifacts/qwen3.5-4b/decode_s4096_gdrl_p8c684/buffers"
tokenizer_dir = "artifacts/qwen3.5-4b/tokenizer"
prefill = "artifacts/qwen3.5-4b/prefill_m256f_s4096_p8c684"

[generation]
max_tokens = 1024
