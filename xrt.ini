; XRT runtime config for `npu serve`. install.sh stages it into the engine root, and serve points
; XRT_INI_PATH at it when unset.
; num_heap_pages: the per-client device-BO heap is suballocated from 64 MiB chunks over a 512 MiB
; virtual range (aie2_pci.h). The default of 1 chunk means an instruction BO larger than 64 MiB
; must grow the heap, and heap growth is firmware-gated (AIE2_ADD_HOST_BUFFER, mgmt protocol
; 6.18+ on npu4) -- when it cannot, amdxdna_init_dev_bo returns -EAGAIN, which reads as
; "CREATE_BO EAGAIN" and has been mistaken for a ~157 MB file-size ceiling. It is not: the
; instruction BO carries only the SELECTED .ctrltext section, and 4 chunks allocates 256 MiB up
; front, sidestepping the growth path entirely.
;
; Set 2026-09-16 to admit the 48-layer batched-prefill ELF, whose main .ctrltext is ~136 MB.
[Debug]
num_heap_pages = 4
