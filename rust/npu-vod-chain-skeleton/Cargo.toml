[package]
name = "npu-vod-chain-skeleton"
version = "0.1.0"
edition = "2021"
description = "VOD -> STT -> LLM -> tool-call wiring skeleton (device-free; stages that would touch NPU hardware are explicit host stubs)"

[[bin]]
name = "vod-chain-skeleton"
path = "src/main.rs"

[dependencies]
ndarray = "0.16"
serde_json = "1"
npu-engine = { path = "../npu-engine" }
npu-gemma = { path = "../npu-gemma", features = ["npu"] }
