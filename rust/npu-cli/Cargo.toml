[package]
name = "npu-cli"
version = "0.1.0"
edition = "2021"
description = "npu - the engine multitool (serve, transcribe, embed, models, config, reload, bake)"

[[bin]]
name = "npu"
path = "src/main.rs"

[dependencies]
npu-runtime = { path = "../npu-runtime" }
npu-engine = { path = "../npu-engine" }
npu-weights = { path = "../npu-weights" }
ndarray = "0.16"
ndarray-npy = { version = "0.9", default-features = false }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
