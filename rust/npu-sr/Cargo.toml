[package]
name = "npu-sr"
version = "0.1.0"
edition = "2021"
description = "NPU super-resolution engine: frame-in/frame-out video upscaling on AMD XDNA2"

[lib]
name = "npu_sr"
path = "src/lib.rs"

[dependencies]
npu-engine = { path = "../npu-engine" }
npu-xrt = { path = "../npu-xrt" }
npu-weights = { path = "../npu-weights" }
ndarray = "0.16"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
ndarray-npy = { version = "0.9", default-features = false }
