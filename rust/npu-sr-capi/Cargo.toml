[package]
name = "npu-sr-capi"
version = "0.1.0"
edition = "2021"
description = "C ABI over npu-sr (libxdna_sr.so, for the ffmpeg vf_xdna_sr filter and other embedders)"

[lib]
name = "xdna_sr"
crate-type = ["cdylib", "staticlib"]

[dependencies]
npu-sr = { path = "../npu-sr" }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
cc = "1"
