[package]
name = "npu-parakeet"
version = "0.1.0"
edition = "2021"
description = "Parakeet-tdt-0.6b-v3 FastConformer encoder — Phase 2 host CPU reference (rel-pos, dwconv k=9, ÷8 conv2D subsample)"

[lib]
name = "npu_parakeet"
path = "src/lib.rs"

[features]
# `npu`: route the encoder's matmuls through the XDNA2 NPU (native whole_array xclbins).
# Off by default so the host f32 reference builds without XRT (CI / other branches).
npu = ["dep:npu-xrt", "dep:npu-onnx", "dep:npu-asr"]

[dependencies]
anyhow = "1"
ndarray = "0.16"
ndarray-npy = { version = "0.9", default-features = false }
npu-weights = { path = "../npu-weights" }
npu-xrt = { path = "../npu-xrt", optional = true }
npu-onnx = { path = "../npu-onnx", optional = true }
# kernel_registry only (engine-op-manifest-and-dynamic-xclbin): npu.rs's artifact-selection sites
# route through npu_asr::kernel_registry instead of reimplementing the naming convention. This is
# a first-cut dependency shape, not a structural endorsement -- kernel_registry.rs living inside
# npu-asr (a GigaAM-named crate) to serve every model is itself a smell already flagged for
# extraction into a shared `npu-bricks` crate (an owner-gated, not-yet-landed design with a
# flagged sequencing conflict against a separate in-flight refactor over this SAME file).
# When that extraction lands, swap this to `npu-bricks` and repoint the `kernel_registry::` import
# below -- do not extract kernel_registry.rs a second time from this crate.
npu-asr = { path = "../npu-asr", optional = true }
rayon = "1"

