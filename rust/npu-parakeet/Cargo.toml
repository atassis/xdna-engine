[package]
name = "npu-parakeet"
version = "0.1.0"
edition = "2021"
description = "Parakeet-tdt-0.6b-v3 FastConformer encoder — Phase 2 host CPU reference (rel-pos, dwconv k=9, ÷8 conv2D subsample)"

[lib]
name = "npu_parakeet"
path = "src/lib.rs"

[features]
# `npu`: route the encoder's matmuls through the XDNA2 NPU (native whole_array xclbins).
# Off by default so the host f32 reference builds without XRT (CI / other branches).
npu = ["dep:npu-xrt", "dep:npu-onnx"]

[dependencies]
anyhow = "1"
ndarray = "0.16"
ndarray-npy = { version = "0.9", default-features = false }
npu-weights = { path = "../npu-weights" }
npu-xrt = { path = "../npu-xrt", optional = true }
npu-onnx = { path = "../npu-onnx", optional = true }
rayon = "1"

[[bin]]
name = "verify_parakeet"
path = "src/bin/verify_parakeet.rs"

[[bin]]
name = "parakeet_encode_npu"
path = "src/bin/parakeet_encode_npu.rs"

[[bin]]
name = "verify_tdt_decoder"
path = "src/bin/verify_tdt_decoder.rs"

[[bin]]
name = "relpos_parity"
path = "src/bin/relpos_parity.rs"
required-features = ["npu"]

[[bin]]
name = "conveyor_parity"
path = "src/bin/conveyor_parity.rs"
required-features = ["npu"]

[[bin]]
name = "fused_seam_parity"
path = "src/bin/fused_seam_parity.rs"
required-features = ["npu"]

# Device probes whose whole body is `#![cfg(feature = "npu")]`. Declared explicitly (not
# auto-discovered) so a default-feature build skips them instead of failing on a missing `main`
# -- the crate must keep building alone, without XRT, per the lib.rs decoupling contract.
[[bin]]
name = "resident_ff1_probe"
path = "src/bin/resident_ff1_probe.rs"
required-features = ["npu"]

[[bin]]
name = "deint_fold_probe"
path = "src/bin/deint_fold_probe.rs"
required-features = ["npu"]

# These four were auto-discovered rather than declared, so `--no-default-features` tried to
# build them without XRT and the decoupling gate (ci_gate.sh step 3) went red on `unresolved
# import npu_xrt`. Declaring them is the same fix the comment above prescribes.
[[bin]]
name = "switch_cost_probe"
path = "src/bin/switch_cost_probe.rs"
required-features = ["npu"]

[[bin]]
name = "gemm_width_probe"
path = "src/bin/gemm_width_probe.rs"
required-features = ["npu"]

[[bin]]
name = "partition_ab_probe"
path = "src/bin/partition_ab_probe.rs"
required-features = ["npu"]

[[bin]]
name = "ff1_parity"
path = "src/bin/ff1_parity.rs"
required-features = ["npu"]

