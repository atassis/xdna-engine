[package]
name = "npu-runtime"
version = "0.1.0"
edition = "2021"
description = "Control plane over npu-engine: desired-state config, reconcile, single device actor"

[features]
testkit = []

[dependencies]
npu-engine = { path = "../npu-engine" }
# SR (`image-sr`) is not a `npu_engine::ModelKind`/`Scenario` variant -- `npu_sr` depends on
# `npu_engine`, so the reverse dependency would cycle. Wired directly here instead: `EngineLoader`
# constructs `npu_sr::SrEngine` for scenario kind `image-sr`; `npu-asr`/`npu-dispatch` give it the
# same `resolve_kernel_dir`/`WA_SUBDIR` every other on-device model resolves its whole_array kernel
# dir with.
npu-sr = { path = "../npu-sr" }
npu-asr = { path = "../npu-asr" }
npu-dispatch = { path = "../npu-dispatch" }
serde = { version = "1", features = ["derive"] }
# preserve_order: a TypeSafe `choice`'s criteria object is ORDERED -- its key order assigns the
# answer letters, and a sorted map would put a different prompt in front of the model.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
