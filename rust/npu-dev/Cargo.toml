[package]
name = "npu-dev"
version = "0.1.0"
edition = "2021"
description = "Single dev binary: probes, parity gates and kernel build tools. Not part of the shipped engine."
autobins = false

[[bin]]
name = "npu-dev"
path = "src/main.rs"

[features]
# These subcommands carry `#[cfg(feature = "npu")]` blocks that resolve against THIS crate, so the
# feature has to exist here or the NPU path vanishes silently. Default-on because npu-xrt is an
# unconditional dependency: there is no XRT-free build here.
default = ["npu"]
npu = []

[dependencies]
npu-xrt = { path = "../npu-xrt" }
npu-asr = { path = "../npu-asr", features = ["two_ctx"] }
npu-asr-host = { path = "../npu-asr-host" }
npu-onnx = { path = "../npu-onnx" }
npu-engine = { path = "../npu-engine" }
npu-parakeet = { path = "../npu-parakeet", features = ["npu"] }
npu-whisper = { path = "../npu-whisper", features = ["npu"] }
npu-sr = { path = "../npu-sr" }
npu-s2 = { path = "../npu-s2" }

anyhow = "1"
ndarray = "0.16"
ndarray-npy = { version = "0.9", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
