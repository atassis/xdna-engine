[package]
name = "npu-capi"
version = "0.1.0"
edition = "2021"
description = "C ABI over the npu-models library (in-process embedding from any language)"

[lib]
name = "npu_models"
crate-type = ["cdylib", "staticlib"]

[dependencies]
npu-models = { path = "../npu-models" }
npu-service = { path = "../npu-service" }

[build-dependencies]
cbindgen = "0.27"

[dev-dependencies]
cc = "1"
