name: rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A hosted runner has neither XRT nor onnxruntime, so it cannot build the crates that link them.
  # It CAN build the three pure-host crates, which run 73 of the 146 workspace tests (measured, not
  # counted from #[test] attributes -- several npu-weights integration tests need artifacts that are
  # not in the repo and execute nothing).
  #
  # This is deliberately the WEAKER half of the gate. It does NOT cover npu-parakeet, npu-xrt,
  # npu-capi or npu-sr-capi, so of the three breakages that motivated scripts/ci_gate.sh it would
  # have caught only one (the npu-asr-host deny-lint). The real gate is scripts/ci_gate.sh on the
  # dev box; promoting this to a self-hosted runner there is what would close the gap.
  host-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # target-cpu=native in rust/.cargo/config.toml is correct for the single dev host but wrong for
      # a runner of unknown vintage, so override it here.
      - name: clippy (host-only crates)
        working-directory: rust
        env:
          RUSTFLAGS: ""
        run: cargo clippy -p npu-asr-host -p npu-gemma -p npu-weights --all-targets

      - name: test (host-only crates)
        working-directory: rust
        env:
          RUSTFLAGS: ""
        run: cargo test -p npu-asr-host -p npu-gemma -p npu-weights
